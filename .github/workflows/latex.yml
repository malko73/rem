name: latex-build

# Reproducible LaTeX build gate for the REM publication package.
# Fails on: fatal errors, undefined references/citations, missing files,
# missing glyphs (xelatex "Missing character").
# PDFs are uploaded as artifacts for manual (Overleaf-style) visual review.

on:
  push:
    paths:
      - 'papers/**'
      - '.github/workflows/latex.yml'
  pull_request:
    paths:
      - 'papers/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install TeX Live + pinned pandoc 3.9
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended \
            lmodern \
            latexmk
          # Pin pandoc to 3.9 (matches the local generator; apt pandoc
          # versions differ and would trip the byte-exact drift gate).
          curl -fsSL -o /tmp/pandoc.tar.gz \
            https://github.com/jgm/pandoc/releases/download/3.9/pandoc-3.9-linux-amd64.tar.gz
          tar -xzf /tmp/pandoc.tar.gz -C /tmp
          sudo mv /tmp/pandoc-3.9/bin/pandoc /usr/local/bin/
          pandoc --version | head -1

      - name: Drift gate — paper .tex matches the Markdown source
        run: |
          python3 tools/gen_paper.py --check
          python3 tools/gen_spec.py --check

      - name: Build REM_lambda v5 (pdflatex)
        run: |
          latexmk -pdf -outdir=papers -interaction=nonstopmode papers/REM_lambda_v5_source.tex

      - name: Build REM Spec v2.0 (pdflatex, utf8 inputenc)
        run: |
          latexmk -pdf -outdir=papers -interaction=nonstopmode papers/REM_spec_v2_0.tex

      - name: Build REM Spec v2.2 (pdflatex, utf8 inputenc)
        run: |
          latexmk -pdf -outdir=papers -interaction=nonstopmode papers/REM_spec_v2_2.tex

      - name: Build REM Paper v0.1 (pdflatex, utf8 inputenc)
        run: |
          latexmk -pdf -outdir=papers -interaction=nonstopmode papers/REM_paper_v0_1.tex

      - name: Gate — logs must be clean
        run: |
          set -e
          for log in papers/REM_lambda_v5_source.log papers/REM_spec_v2_0.log papers/REM_spec_v2_2.log papers/REM_paper_v0_1.log; do
            echo "=== $log ==="
            if grep -qE "^! |Fatal error|Emergency stop|LaTeX Error|Undefined control sequence" "$log"; then
              echo "FATAL in $log:"; grep -E "^! |Fatal error|Emergency stop|LaTeX Error|Undefined control sequence" "$log" | head -20; exit 1
            fi
            if grep -q "undefined" "$log"; then
              echo "UNDEFINED REF/CITATION in $log:"; grep "undefined" "$log" | head -20; exit 1
            fi
            if grep -qE "File .* not found" "$log"; then
              echo "MISSING FILE in $log:"; grep -E "File .* not found" "$log" | head -20; exit 1
            fi
            if grep -q "Missing character" "$log"; then
              echo "MISSING GLYPH in $log:"; grep "Missing character" "$log" | head -20; exit 1
            fi
            echo "OK"
          done

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: rem-papers
          path: |
            papers/REM_lambda_v5_source.pdf
            papers/REM_spec_v2_0.pdf
            papers/REM_spec_v2_2.pdf
            papers/REM_paper_v0_1.pdf
          if-no-files-found: error
